name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python compiles and imports
        run: |
          pip install -q -r requirements.txt
          python -m py_compile ista_mcp/server.py scripts/smoke.py
          ISTA_MCP_SSH=user@example python -c "import sys; sys.path.insert(0,'.'); import ista_mcp.server as s; print('tools ok')"
      - name: No VINs, licence ids or private addresses
        run: |
          ! git grep -n -E 'WBA[A-Z0-9]{14}|[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}|100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}' -- . || (echo "identifier found" && exit 1)
      - name: PowerShell parses
        run: |
          sudo apt-get install -y -qq powershell >/dev/null 2>&1 || pip install -q pwsh 2>/dev/null || true
          for f in scripts/*.ps1; do pwsh -NoProfile -Command "\$t=\$null; \$e=\$null; [System.Management.Automation.Language.Parser]::ParseFile('$f', [ref]\$t, [ref]\$e) | Out-Null; if (\$e) { \$e; exit 1 }; Write-Host 'ok $f'" || exit 1; done
